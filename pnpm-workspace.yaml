packages:
  - apps/*
  - packages/*

# Single source of truth for dependency versions shared across workspaces.
catalog:
  typescript: ^6.0.3
  zod: ^4.6.7
  vitest: ^4.1.2
  '@types/node': ^24.0.0
  '@nestjs/common': ^12.4.0
  '@nestjs/core': ^12.4.0

# Packages whose install scripts are allowed to run (pnpm 11 deny-by-default).
allowBuilds:
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@scarf/scarf': false
